  job_fit_agent:
    name: "Job Fit Agent"
    description: "Python-based job discovery and career intelligence agent that collects roles from Ashby and Greenhouse, scores role fit, evaluates geographic/seniority viability, stores results in SQLite, and sends Telegram notifications through GitHub Actions."
    technologies:
      - Python
      - SQLite
      - GitHub Actions
      - Telegram Bot API
      - Ashby
      - Greenhouse
      - pytest
    themes:
      - job intelligence
      - automation
      - scoring
      - persistence
      - notifications
      - agentic workflow foundation

  rwlv_priority_governor:
    name: "RWLV Priority Governor Agent"
    description: "OpenClaw- and Hermes Agent-based workflow agent that helps triage active web/product work, prioritize Asana tasks, and send Telegram briefings using GPT-5.5 and OpenAI API workflows while evaluating local LLM patterns such as Qwen 3 where practical. Built to reduce operational friction across shifting priorities and limited engineering/vendor capacity."
    technologies:
