      - Hermes Agent
      - GPT-5.5
      - OpenAI API
      - local LLMs
      - Qwen 3
      - Telegram
      - Asana
      - Python
      - Markdown configuration
      - Cron / scheduled automation
    themes:
      - agentic operations
      - prioritization
      - workflow routing
      - operational AI
      - product operations
      - internal automation

resume_tailoring_permissions:
  may_change:
    - resume headline
    - professional summary
    - core skills
    - tools and platforms
    - job description bullets
    - project descriptions
    - project ordering
    - keyword emphasis
    - selected accomplishments
  must_preserve:
    - company names
    - employment dates
    - education
    - factual project ownership
    - factual tool usage
  must_not_do:
    - fabricate metrics
    - fabricate employers
    - fabricate certifications
    - claim expert-level software engineering depth without support
    - imply production adoption if project is still in MVP/prototype stage
    - auto-submit applications
  preferred_style:
    - direct
    - credible
    - specific
    - product-oriented
    - AI-forward but not hype-driven
    - avoid defaulting to AI-native phrasing
