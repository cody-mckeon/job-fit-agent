[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-fit-agent"
version = "0.1.0"
description = "Agentic job search assistant scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
