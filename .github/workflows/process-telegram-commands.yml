name: Process Telegram Commands

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  process-telegram-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Process Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m job_fit_agent.main process-telegram-updates --quiet-if-empty
          else
            python -m job_fit_agent.main process-telegram-updates --notify-empty
          fi

      - name: Commit processed Telegram status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/application_status.json data/company_application_blocks.json data/telegram_processed_updates.json
          if git diff --cached --quiet; then
            echo "No Telegram status changes to commit."
          else
            git commit -m "Process Telegram status commands"
            git push
          fi
