name: Job Fit Agent

on:
  workflow_dispatch:
    inputs:
      reset_database:
        description: "Delete SQLite DB before run?"
        required: false
        default: "false"
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    env:
      JOB_FIT_ENABLE_LEVER: "true"
      CLIENT_ID: github-actions
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest

      - name: Clear runtime DB after tests
        run: rm -f data/jobs.sqlite data/jobs.sqlite-shm data/jobs.sqlite-wal

      - name: Optionally reset database
        if: ${{ github.event.inputs.reset_database == 'true' }}
        run: rm -f data/jobs.sqlite

      - name: Run collection pipeline
        run: python -m job_fit_agent.main run

      - name: Rescore jobs
        run: python -m job_fit_agent.main rescore

      - name: Print digest
        run: python -m job_fit_agent.main digest

      - name: Prep next application package and notify Telegram
        run: python -m job_fit_agent.main prep-next-application --skip-browser --notify-telegram
